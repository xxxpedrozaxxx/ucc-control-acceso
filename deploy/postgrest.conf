# =============================================================
# PostgREST — Configuracion para despliegue local UCC
# Documentacion: https://postgrest.org/en/stable/references/configuration.html
# =============================================================

# Cadena de conexion a PostgreSQL
# Reemplaza 123456789 por la contrasena real de ucc_app
db-uri = "postgres://ucc_app:123456789@localhost:5432/ucc_control"

# Schema que expone PostgREST como API REST
db-schema = "public"

# Rol anonimo: el que usa la app cuando no hay JWT de usuario
# ucc_app tiene los GRANT necesarios (ver 08_permisos.sql)
db-anon-role = "ucc_app"

# Puerto donde escucha PostgREST
server-port = 3000

# JWT Secret: debe ser IDENTICO al JWT_SECRET del .env del frontend
# Minimo 32 caracteres, cadena aleatoria
jwt-secret = "TGrkLhHOWgAV2f6XIEZbanQD7cYlKeoPtRvqByS0jCN1xsUJ4wd5zMu3m8Fpi9"

# Maximo de filas por respuesta (proteccion contra consultas enormes)
db-max-rows = 10000

# Nivel de log (info es suficiente para produccion)
log-level = "info"